---
baseURL: "https://kasader.github.io/"
title: "Casaderic Compendivm"
theme: "github.com/frjo/hugo-theme-zen/v7"
locale: "en-US"
defaultContentLanguage: "en"
summaryLength: 25

# Class-based highlighting (Hugo defaults to inline monokai styles, which
# can't be themed). Colours live in assets/css/syntax.css.
markup:
  highlight:
    noClasses: false
    lineNos: false
    tabWidth: 4
  tableOfContents:
    # h2..h6. startLevel stays at 2 because the page's <h1> is the front-matter
    # title, already shown above the list.
    startLevel: 2
    endLevel: 6
    ordered: false

# The right-hand table of contents rides on the theme's second-sidebar grid
# area, which is gated behind the "sidebar" param. Only posts want it.
cascade:
  - target:
      path: /posts/**
    params:
      sidebar: true

outputFormats:
  SearchIndex:
    mediaType: "application/json"
    baseName: "searchindex"
    isPlainText: true
    notAlternative: true

outputs:
  home: ["HTML", "RSS", "JSON", "SearchIndex"]
  section: ["HTML", "RSS", "JSON"]

params:
  description: "Notes on Go, distributed systems, and infrastructure."
  dateformat: "2 January, 2006"
  feedlinks: true
  logoWidth: 96
  mainSections:
    - posts
  poweredby: false
  submitted: true
  author:
    name: "Sasha Casada"

  # Rendered by layouts/_partials/social-links.html into the footer.
  # rel="me" lets these double as IndieWeb/Mastodon identity verification.
  social:
    - name: "GitHub"
      url: "https://github.com/kasader"
    - name: "LinkedIn"
      url: "https://linkedin.com/in/scasada"
